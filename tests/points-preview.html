<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Points workflow fixture</title></head>
<body><label>حساب الاختبار <select id="fixture-account"><option value="learner">متعلّم الاختبار</option><option value="teacher">مدرّب دورة التطريز</option></select></label><div id="root"></div>
<script type="module">
  // Use only on the isolated localhost preview origin, never a deployed account.
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import App from '/src/App.jsx';
  import '/src/styles/global.css';
  if (!import.meta.env.DEV || location.hostname !== 'localhost') throw new Error('Use the isolated localhost development origin for this fixture.');
  const profiles = {
    learner: { id: 'qa-points-20261008', name: 'متعلّم الاختبار', role: 'both' },
    teacher: { id: 'catalog-instructor:3', name: 'مدرّب الاختبار', role: 'both' },
  };
  function selectAccount(value) {
    localStorage.setItem('esham-account-profile-v1', JSON.stringify(profiles[value]));
    window.dispatchEvent(new Event('esham-profile-updated'));
  }
  selectAccount('learner');
  document.getElementById('fixture-account').addEventListener('change', event => selectAccount(event.target.value));
  history.replaceState(null, '', '/courses/3');
  createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
