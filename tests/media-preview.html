<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>اختبار ملفات الفرونت</title><style>body{font:18px Arial;margin:30px}button,a{margin:10px;padding:10px}video{width:640px;max-width:100%}canvas{display:none}</style></head><body><h1>اختبار ملفات الفرونت · بيئة تطوير منفصلة</h1><button id="generate">اختبار فيديو حقيقي وقصه وحفظه</button><button id="reload">تحميل الفيديو المحفوظ</button><button id="pdf-ar">شهادة عربية</button><button id="pdf-long-ar">شهادة عربية باسم طويل</button><button id="pdf-en">شهادة إنجليزية باسم طويل</button><p role="status" id="status"></p><video controls playsinline></video><canvas width="640" height="360"></canvas><script type="module">
import {saveMedia,readMedia} from '/src/services/mediaStore.js';
import {trimVideo,inspectVideo,recordingMimeType} from '/src/services/videoProcessing.js';
import {createCertificatePdf,downloadBlob} from '/src/services/certificatePdf.js';
import logo from '/src/assets/esham-logo.png';
import {getInstructorCourseWorkspace} from '/src/data/instructorCourseWorkspace.js';
import {courses} from '/src/data/courses.js';
import {enrollWithPoints} from '/src/data/pointsLedger.js';
import {courseTasks,saveTaskSubmission,reviewTaskSubmission} from '/src/services/taskSubmissions.js';
if(!import.meta.env.DEV||location.hostname!=='localhost')throw Error('Development fixture only');
const status=document.querySelector('#status'),canvas=document.querySelector('canvas'),context=canvas.getContext('2d'),player=document.querySelector('video');
const openEditor=document.createElement('button');openEditor.textContent='عرض محرر الفيديو في الموقع';document.body.append(openEditor);
openEditor.onclick=async()=>{const id=sessionStorage.getItem('qa-media-id'),media=await readMedia(id);if(!media){status.textContent='شغّل اختبار الفيديو أولًا';return;}const workspace=getInstructorCourseWorkspace('photography'),section=workspace.sections[0],lesson=section.lessons[0];localStorage.setItem(`esham-video-draft:photography:${section.id}:${lesson.id}`,JSON.stringify({mediaId:id,name:media.name,sizeBytes:media.sizeBytes,durationSeconds:media.durationSeconds,quality:'640×360'}));location.href=`/instructor/courses/photography/sections/${section.id}/lessons/${lesson.id}/video/edit`;};
const openCertificate=document.createElement('button');openCertificate.textContent='معاينة شهادة حساب الاختبار';document.body.append(openCertificate);
openCertificate.onclick=()=>{const profile={id:'qa-certificate',role:'learner',name:'أحمد الاختبار',username:'qa_certificate'},course=courses.find(item=>item.id===3);localStorage.setItem('esham-account-profile-v1',JSON.stringify(profile));enrollWithPoints(profile,3);localStorage.setItem('esham-learner-progress-v1:qa-certificate',JSON.stringify([{courseId:3,completedLessonIds:course.curriculum.flatMap(section=>section.lessons.map(lesson=>lesson.id))}]));for(const task of courseTasks().filter(item=>item.courseId===3)){try{const saved=saveTaskSubmission(profile,task.id,{answer:'QA certificate approved task',submit:true});reviewTaskSubmission({id:course.instructorId,role:'instructor'},saved.id,true,'QA');}catch{/* Previously approved fixture. */}}location.href='/learner/courses/certificates/3';};
document.querySelector('#generate').onclick=async()=>{try{
 status.textContent='جاري تسجيل فيديو الاختبار…'; const stream=canvas.captureStream(30),recorder=new MediaRecorder(stream,{mimeType:recordingMimeType()}),chunks=[];const start=performance.now();
 const draw=()=>{const elapsed=(performance.now()-start)/1000;context.fillStyle='#173447';context.fillRect(0,0,640,360);context.fillStyle='#ffb923';context.fillRect((elapsed*100)%600,80,40,40);context.fillStyle='white';context.font='32px Arial';context.fillText(elapsed.toFixed(2)+' seconds',200,250);if(recorder.state!=='inactive')requestAnimationFrame(draw);};
 const recorded=new Promise(resolve=>{recorder.ondataavailable=event=>chunks.push(event.data);recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType}));});recorder.start(250);draw();setTimeout(()=>recorder.stop(),4200);const original=await recorded;stream.getTracks().forEach(track=>track.stop());
 const metadata=await inspectVideo(original);status.textContent='جاري قص الفيديو من الثانية 1 إلى 3…';const trimmed=await trimVideo(original,{start:1,end:3,duration:metadata.durationSeconds});const inspected=await inspectVideo(trimmed);const saved=await saveMedia(trimmed,{name:'qa-trimmed.webm',durationSeconds:inspected.durationSeconds});sessionStorage.setItem('qa-media-id',saved.id);player.src=URL.createObjectURL(trimmed);status.textContent=JSON.stringify({originalSeconds:metadata.durationSeconds,trimmedSeconds:inspected.durationSeconds,size:saved.sizeBytes,mediaId:saved.id});
}catch(error){status.textContent='ERROR: '+error.message;}};
document.querySelector('#reload').onclick=async()=>{const saved=await readMedia(sessionStorage.getItem('qa-media-id'));player.src=URL.createObjectURL(saved.blob);status.textContent='تم تحميل ملف الفيديو من التخزين بعد إعادة فتح الصفحة: '+saved.sizeBytes+' bytes';};
for(const id of ['ar','long-ar','en'])document.querySelector('#pdf-'+id).onclick=async()=>{try{const blob=await createCertificatePdf({name:id==='ar'?'أحمد محمد':id==='long-ar'?'عبد الرحمن محمد عبد الله أحمد علي الحسن الشامي الفلسطيني':'Alexandra Catherine Montgomery Robertson Wilson',course:id==='en'?'Professional Project Management and Enterprise Digital Transformation':'الإدارة المهنية للمشاريع وتطوير المهارات المؤسسية والتحول الرقمي',instructor:id==='en'?'Sarah Elizabeth Robertson':'سارة أحمد عبد الرحمن',language:id==='en'?'en':'ar',logo});const link=document.createElement('a');link.href=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob);});link.download='certificate-'+id+'.pdf';link.textContent='تنزيل ملف '+id;document.body.append(link);status.textContent='تم إنشاء الشهادة '+id;}catch(error){status.textContent=error.message;}};
</script></body></html>
